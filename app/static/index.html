<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI ToDo & Habits</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <!-- Header with XP Bar -->
        <header class="glass-header">
            <div class="user-info">
                <div class="avatar" id="user-avatar">👤</div>
                <div class="user-details">
                    <h2 id="user-name">Загрузка...</h2>
                    <p>Уровень <span id="user-level">1</span></p>
                </div>
            </div>
            <div class="xp-container">
                <div class="xp-text"><span id="user-xp">0</span> / <span id="user-next-xp">100</span> XP</div>
                <div class="xp-bar-bg">
                    <div class="xp-bar-fill" id="xp-bar-fill"></div>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Tasks Tab -->
            <section id="tab-tasks" class="tab-content active">
                <div class="section-header">
                    <h3>Задачи на сегодня</h3>
                    <span class="badge" id="tasks-count">0</span>
                </div>
                <div id="tasks-list" class="items-list">
                    <div class="loading">Загрузка задач...</div>
                </div>
            </section>

            <!-- Habits Tab -->
            <section id="tab-habits" class="tab-content">
                <div class="section-header">
                    <h3>Трекер привычек</h3>
                    <button class="icon-btn" onclick="showAddHabitModal()">➕</button>
                </div>
                <div id="habits-list" class="items-list">
                    <!-- Habits will be loaded here -->
                </div>
            </section>

            <!-- AI Tab -->
            <section id="tab-ai" class="tab-content">
                <div class="ai-container">
                    <div class="ai-avatar">🤖</div>
                    <h3>ИИ Ассистент</h3>
                    <p class="ai-subtitle">Отправь мне текст или наговори голосом, и я сам распланирую это!</p>
                    
                    <div class="ai-input-wrapper">
                        <textarea id="ai-text-input" placeholder="Например: Завтра в 15:00 сходить в зал..."></textarea>
                        <div class="ai-actions">
                            <button id="btn-voice" class="glass-btn pulse-anim">🎙 Голос</button>
                            <button id="btn-send" class="glass-btn primary">Отправить</button>
                        </div>
                    </div>
                    <div id="ai-status" class="ai-status-text"></div>
                </div>
            </section>
        </main>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav glass-nav">
            <button class="nav-item active" data-target="tab-tasks">
                <span class="nav-icon">📅</span>
                <span class="nav-label">Задачи</span>
            </button>
            <button class="nav-item" data-target="tab-habits">
                <span class="nav-icon">🔥</span>
                <span class="nav-label">Привычки</span>
            </button>
            <button class="nav-item" data-target="tab-ai">
                <span class="nav-icon">✨</span>
                <span class="nav-label">Ассистент</span>
            </button>
        </nav>
    </div>

    <!-- Modals -->
    <div id="add-habit-modal" class="modal-overlay hidden">
        <div class="modal-content glass-panel">
            <h3>Новая привычка</h3>
            <input type="text" id="new-habit-name" placeholder="Например: Выпить стакан воды" class="glass-input">
            <div class="modal-actions">
                <button class="glass-btn" onclick="hideAddHabitModal()">Отмена</button>
                <button class="glass-btn primary" onclick="submitNewHabit()">Добавить</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
